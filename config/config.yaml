# Adaptive Cyber-Physical Security - Configuration
# Ensures reproducibility across runs

project:
  name: "adaptive_cps"
  seed: 42
  phase: 1

paths:
  data_dir: "data/raw"
  processed_dir: "data/processed"
  models_dir: "models"
  figures_dir: "figures"
  reports_dir: "reports"

dataset:
  # Switched to CIC-IDS (CSV format). Place files under data/raw/.
  name: "cic_ids"
  train_file: "cicids2017_all.csv"
  test_file: null
  sep: ","
  label_col: "Label"
  # If test_file is absent, loader creates deterministic split from train_file.
  test_size: 0.2
  # Normal traffic labels for binary anomaly mapping.
  benign_labels: ["BENIGN"]

# Feature Engineering
features:
  # CIC-IDS is mostly numeric; keep categorical list empty unless your CSV has categories.
  categorical: []
  # Columns to log-transform (heavy right skew)
  log_transform: ["Flow Duration", "Total Fwd Packets", "Total Backward Packets"]
  # Columns excluded from model (e.g., high cardinality, leakage)
  exclude: ["Flow ID", "Source IP", "Source Port", "Destination IP", "Destination Port", "Timestamp"]
  # PCA components for optional dimensionality reduction (0 = disabled)
  pca_components: 0

# MAE (Masked Autoencoder) - BERT-style pre-training
mae:
  # Masking: BERT uses ~15%; we use 15-25% for tabular (less redundancy)
  mask_ratio: 0.15
  mask_token_id: -1  # Placeholder for masked positions
  # Architecture
  hidden_dim: 128
  num_layers: 4
  num_heads: 4
  dropout: 0.1
  # mean_max: fuse mean & max token pooling (tabular readout); mean: ablation
  readout_mode: "mean_max"
  # Training
  batch_size: 256
  epochs: 50
  lr: 1e-3
  weight_decay: 1e-5
  val_ratio: 0.15
  early_stopping_patience: 12
  # cosine | plateau | none
  lr_scheduler: "cosine"
  # Tabular Mixup for reconstruction (0 = off)
  mixup_alpha: 0.15
  # Xavier/Glorot initialization for stable gradients
  init: "xavier"

# One-Class SVM (on frozen MAE embeddings)
ocsvm:
  kernel: "rbf"
  nu: 0.01  # Upper bound on fraction of anomalies
  gamma: "scale"  # 1 / (n_features * X.var())
  # MAE embedding inference batch (lower if OS kills the process — was single 67k batch)
  embedding_batch_size: 1024
  # Optional cap on benign rows for OCSVM.fit only (null = all). Use if fit still OOMs.
  max_fit_samples: null

# Evaluation
evaluation:
  metrics: ["accuracy", "precision", "recall", "f1", "roc_auc"]
  # For anomaly detection: F1 on anomaly class is key
  primary_metric: "f1"
